# Keep the real client IP when an upstream proxy (the prod edge) already
# resolved it; fall back to the direct peer otherwise (local dev).
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are safe to cache indefinitely -- their filename
    # changes whenever their content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy the API (and its docs) to the backend container over the
    # internal Docker network, so the browser only ever talks to this
    # container's port -- no separate :8000 exposure needed, locally or
    # in production behind an external TLS proxy.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
}
